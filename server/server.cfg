# Code Zero: San Andreas - txAdmin recipe template
# Keep the Cfx key and database string in txAdmin's private recipe inputs.
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set mysql_connection_string "{{dbConnectionString}}"
{{serverEndpoints}}

set onesync on
sv_enforceGameBuild 3095
sv_scriptHookAllowed 0
sv_endpointprivacy true
load_server_icon "server-icon.png"

set resources_useSystemChat true
set steam_webApiKey "none"
sets locale "en-US"

# Voice
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# QBCore
setr qb_locale "en"
setr UseTarget true

# Cfx base resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# Data and framework
ensure oxmysql
ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]
ensure [codezero]

# Permissions
add_ace group.admin command allow
add_ace resource.qb-core command allow
add_ace qbcore.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
{{addPrincipalsMaster}}

# Configure server name, description, tags, and banners in the Cfx Portal.
